name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stamina
          POSTGRES_PASSWORD: stamina
          POSTGRES_DB: stamina_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stamina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Seam 1 runs against this real Postgres instead of the embedded one used locally.
      TEST_DATABASE_URL: postgres://stamina:stamina@localhost:5432/stamina_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm nx affected -t lint typecheck test build

  ui-kit:
    name: UI kit in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Needs real layout and painting, which jsdom lacks: runs the dev-only /dev/ui page on the
      # Vite dev server (no database or API). The preview deploy is a production build and has no such page.
      - run: pnpm --filter @stamina/web exec playwright install --with-deps chromium
      - run: pnpm --filter @stamina/web e2e:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-ui-kit
          path: apps/web/playwright-report
          retention-days: 7

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The binary is run directly (MIT) rather than via gitleaks-action, whose EULA
      # restricts use on organisation repos. Pinned version + checksum.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --no-banner --verbose .

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
