name: Bug
description: Something behaves differently from what it should
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not paste health data (Screening answers, Check-ins, weights) into this issue.
