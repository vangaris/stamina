packages:
  - apps/*
  - packages/*
  - packages/ui/*
  - packages/util/*
onlyBuiltDependencies:
  - esbuild
  - embedded-postgres
  - '@embedded-postgres/darwin-arm64'
  - '@embedded-postgres/darwin-x64'
  - '@embedded-postgres/linux-arm64'
  - '@embedded-postgres/linux-x64'
  - nx
# Security overrides for dev-tool transitive deps flagged by OSV-Scanner (remove when upstream bumps):
overrides:
  undici: '^7.30.1'
  esbuild@0.18.20: '0.25.12'
